<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista zadań</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      h2 {
        text-align: center;
      }
      .priority {
        background-color: red;
        color: white;
      }
    </style>
  </head>
  <body class="bg-dark text-light">
    <div class="container mt-5">
      <h2 class="mb-4">Lista zadań</h2>
      <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Dodaj nowe zadanie" />
        <button id="addTask" class="btn btn-primary">Dodaj</button>
      </div>
      <ul id="taskList" class="list-group"></ul>
    </div>

    <script>
      $(document).ready(function () {
        
        let taskCounter = 1;

        // Funkcja dodająca zadanie do listy
        function addTaskToList(taskText) {
          let taskItem = $(`
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span>${taskCounter}. ${taskText}</span>
            </li>
          `);

          // Przycisk "Usuń"
          let removeButton = $('<button class="btn btn-danger btn-sm">Usuń</button>');
          removeButton.click(function () {
            $(this).parent().fadeOut(500, function () {
              $(this).remove();
              updateTaskNumbers();
            });
          });

          // Przycisk "Edytcja"
          let editButton = $('<button class="btn btn-success btn-sm">Edytcja</button>');
          editButton.click(function () {
            let taskItem = $(this).parent();
            let currentText = taskItem.contents().first().text().trim();
            let newText = prompt("Edytuj zadanie:", currentText);
            if (newText) {
              taskItem.contents().first().replaceWith(newText);
            }
          });

          // Przycisk "Priorytet"
          let priorityButton = $('<button class="btn btn-warning btn-sm">Priorytet</button>');
          priorityButton.click(function () {
            $(this).parent().toggleClass('priority');
          });

          // Dodajemy przyciski do zadania
          taskItem.append(removeButton);
          taskItem.append(editButton);
          taskItem.append(priorityButton);

          // Dodaj zadanie do listy
          $("#taskList").append(taskItem);
          taskCounter++;
        }

        // Dodawanie zadania po kliknięciu "Dodaj"
        $("#addTask").click(function () {
          let taskText = $("#taskInput").val().trim();

          if (taskText !== "") {
            addTaskToList(taskText);
            $("#taskInput").val(""); // Reset input
          }
        });

        // Aktualizacja numerów zadań po zmianie
        function updateTaskNumbers() {
          $("#taskList li").each(function (index) {
            let taskText = $(this).find('span').text().split('. ').slice(1).join('. ');
            $(this).find('span').text((index + 1) + ". " + taskText);
          });
        }
      });
    </script>
  </body>
</html>
