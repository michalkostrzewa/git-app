<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista zadań</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      h2 {
        text-align: center;
      }
      .completed {
        text-decoration: line-through;
        color: gray;
      }
    </style>
  </head>
  <body class="bg-dark text-light">
    <div class="container mt-5">
      <h2 class="mb-4">Lista zadań</h2>
      <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Dodaj nowe zadanie" />
        <button id="addTask" class="btn btn-primary">Dodaj</button>
      </div>
      <ul id="taskList" class="list-group"></ul>
    </div>

    <script>
      $(document).ready(function () {
        let taskCounter = 1;

      
        $("#addTask").click(function () {
          let taskText = $("#taskInput").val().trim();

          if (taskText !== "") {
            let taskItem = $(`
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${taskCounter}. ${taskText}</span>
              </li>
            `);

           
            let removeButton = $('<button class="btn btn-danger btn-sm">Usuń</button>');
            removeButton.click(function () {
              $(this).parent().remove();
              updateTaskNumbers(); 
            });

          
            let completeButton = $('<button class="btn btn-success btn-sm ms-2">Zakończ</button>');
            completeButton.click(function () {
              $(this).parent().toggleClass('completed');
              if ($(this).parent().hasClass('completed')) {
                $(this).text('Odznacz'); 
              } else {
                $(this).text('Zakończ'); 
              }
            });

            taskItem.append(removeButton);
            taskItem.append(completeButton);
            $("#taskList").append(taskItem);

            taskCounter++; 
            $("#taskInput").val(""); 

            updateTaskNumbers();
          }
        });

       
        function updateTaskNumbers() {
          $("#taskList li").each(function (index) {
            let taskText = $(this).find('span').text().split('. ').slice(1).join('. ');
            $(this).find('span').text((index + 1) + ". " + taskText);
          });
        }
      });
    </script>
  </body>
</html>
