<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista zadań</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      h2
      {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="mb-4">Lista zadań</h2>
      <Button onclick="przelacz()" style="border-radius: 20px;">Zmień motyw</Button>
      <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Dodaj nowe zadanie" />
        <button id="addTask" class="btn btn-primary">Dodaj</button>
      </div>
      <ul id="taskList" class="list-group"></ul>
    </div>

    <script>
      var changeTheme=0;
      function przelacz() {
        if (changeTheme==0) {
        document.body.style.backgroundColor = "#222";
        document.body.style.color = "white";
        changeTheme=1
        }
        else {
          document.body.style.backgroundColor = "white";
        document.body.style.color = "#222";
        changeTheme=0
        }

      }
      $(document).ready(function () {
        
        let taskCounter = 1;

      
        $("#addTask").click(function () {
          let taskText = $("#taskInput").val().trim();

          if (taskText !== "") {
           
            let taskItem = $(`
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${taskCounter}. ${taskText}</span>
              </li>
            `);

            taskItem.text(taskText);
            let removeButton = $('<button class="btn btn-danger btn-sm">Usuń</button>');
            let editButton = $('<button id="" class="btn btn-success bt-sm">Edytcja</button>');
            removeButton.click(function () {
              $(this).parent().remove();
              updateTaskNumbers(); 
            });
            editButton.click(function () {
              let taskItem = $(this).parent(); // Pobranie elementu <li>
              let currentText = taskItem.contents().first().text().trim(); // Pobranie tekstu zadania (bez przycisków)
              let newText = prompt("Edytuj zadanie:", currentText); // Okno do wpisania nowego tekstu

              if (newText) {  
                taskItem.contents().first().replaceWith(newText); // Zastąpienie starego tekstu nowym
              }
            });

            taskItem.append(removeButton);
            taskItem.append(editButton);
            $("#taskList").append(taskItem);

      
            taskCounter++;

           
            $("#taskInput").val("");

          
            updateTaskNumbers();
          }

        });

        
        function updateTaskNumbers() {
          $("#taskList li").each(function (index) {
           
            let taskText = $(this).find('span').text().split('. ').slice(1).join('. ');
        
            $(this).find('span').text((index + 1) + ". " + taskText);
          });
        }
      });
    </script>
  </body>
</html>
